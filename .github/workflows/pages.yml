name: Pages

# Publikuje vygenerovaný web z docs/ na GitHub Pages.
# Pages v repu jedou v režimu "GitHub Actions" (Settings → Pages → Source),
# takže je potřeba tenhle workflow; `docs/CNAME` se v tomhle režimu ignoruje
# a doména se nastavuje v Settings → Pages → Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
